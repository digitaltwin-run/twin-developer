ie schematu ticketów na subactor.twin-developer.ticket-intent/v1&quot;,\n    &quot;E-0 oba intenty przestają deklarować new-project.intent/v3&quot;,\n    &quot;E-0 scripts/check-schema-identity.py jako bramka w make validate&quot;,\n    &quot;zapis ankiety 34 standardów wellmanifest w dokumencie planu&quot;\n  ],\n  &quot;allowedPaths&quot;: [\n    &quot;schemas/**&quot;,\n    &quot;scripts/**&quot;,\n    &quot;project/ticket-00*/**&quot;,\n    &quot;project/TICKETS.md&quot;,\n    &quot;docs/**&quot;,\n    &quot;Makefile&quot;\n  ],\n  &quot;forbiddenEffects&quot;: [\n    &quot;edycja plików zarządzanych w repozytoriach adoptujących wellmanifest&quot;,\n    &quot;deklarowanie zgodności z cudzym standardem bez potwierdzenia jego walidatorem&quot;,\n    &quot;commit bez zielonych bramek make validate i make test&quot;,\n    &quot;merge&quot;,\n    &quot;deployment&quot;\n  ],\n  &quot;dependencies&quot;: [\n    &quot;wellmanifest/new-project governance/intent.schema.json jako kontrakt odniesienia&quot;\n  ],\n  &quot;validation&quot;: [\n    &quot;make validate&quot;,\n    &quot;make test&quot;\n  ],\n  &quot;acceptanceCriteria&quot;: [\n    &quot;Żaden plik w schemas/ nie deklaruje $id ani const należącego do obcego właściciela.&quot;,\n    &quot;Ponowne wstawienie podrobionego $id kończy się SCHEMA-IDENTITY-FAIL i kodem 1.&quot;,\n    &quot;Oba intenty deklarują wyłącznie lokalną przestrzeń nazw.&quot;,\n    &quot;Dokument planu odnotowuje wynik ankiety wellmanifest wraz z obiema pułapkami pomiarowymi.&quot;\n  ],\n  &quot;evidencePolicy&quot;: {\n    &quot;humanIntentHome&quot;: &quot;config/source-policy.json#truthDomains/humanIntent&quot;,\n    &quot;projectRealityHome&quot;: &quot;config/source-policy.json#truthDomains/projectReality&quot;,\n    &quot;llmAuthority&quot;: &quot;propose-only&quot;,\n    &quot;unknownIsFalse&quot;: false\n  }\n}\n", "is_subdir": true}, {"name": "README.md", "rel_path": "ticket-001/README.md", "path": "ticket-001 / README.md", "size": "2.4KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "# ticket-001 — Developer Digital Twin from prompt histories\n\nStatus: **DONE (example implementation)**  \nWorkstream: `runtime_service`  \nOwner: `human:founder`  \nAgent role: `agent:implementation` (propose/implement/test; no merge authority)\n\n## Problem\n\nHistories from IDE/chat/shell contain useful knowledge about how the developer resolves conflicts, validates changes and organizes Subactor work. They also contain stale facts, incorrect agent claims, context-specific commands and secrets. Passing the raw history directly to a coding LLM would reproduce those contradictions instead of controlling them.\n\n## Goal\n\nCreate a governed, evidence-grounded **behavioral execution-policy twin** that:\n\n1. ingests the two supplied histories;\n2. redacts secrets and preserves provenance;\n3. separates human intent from project reality;\n4. generates and validates a DSL;\n5. exposes Python CLI/shell/REST backed by LiteLLM/OpenRouter or a local endpoint;\n6. produces validated guidelines and an Aider message;\n7. remains propose-only until explicit source-mutation approval.\n\n## Acceptance criteria\n\n- [x] AC-01 — Markdown transcript and Cursor export are parsed into normalized append-only events.\n- [x] AC-02 — Every active rule has existing `evidenceRefs`, scope, confidence and conflict policy.\n- [x] AC-03 — Agent statements cannot activate a rule or become a test receipt.\n- [x] AC-04 — Context conflict “remove this Docker” vs “use Docker for production parity” remains contextual.\n- [x] AC-05 — Current offer is read from versioned HOME and prompt price claims are reported separately.\n- [x] AC-06 — Python service provides CLI, interactive shell and REST; real mode uses LiteLLM, fake mode is testable offline.\n- [x] AC-07 — TypeScript validates all LLM evidence references and guideline rule references.\n- [x] AC-08 — Aider receives a minimal validated message and defaults to dry-run/no auto-commit.\n- [x] AC-09 — TypeScript, Python and JSON Schema tests pass.\n- [x] AC-10 — README documents setup, routing, source hierarchy, limitations and next steps.\n\n## Validation receipts\n\nSee `changelog.md` and generated files in `data/output/`. The verified commands are:\n\n```bash\nmake test\nmake llm-fake-demo\nmake validate\n```\n\nA live OpenRouter request is intentionally not part of the offline acceptance gate; it requires a private key and is performed with `--mode require-llm` in the target environment.\n", "is_subdir": true}, {"name": "README.md", "rel_path": "ticket-002/README.md", "path": "ticket-002 / README.md", "size": "2.8KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "# ticket-002 — Faza 0 planu autonomii\n\nZakres wynika bezpośrednio z `docs/AUDIT_AND_AUTONOMY_PLAN.md`, sekcja\n„Faza 0 — Naprawy blokujące (przed jakimkolwiek grantem)\".\n\nTicket zamyka wyłącznie defekty P0 z grup A (granica efektów) i B (proweniencja),\nplus dwa fundamenty, bez których reszta planu nie ma się o co oprzeć:\nbramkę reprodukowalności i schematy konfiguracji.\n\n## Dlaczego akurat te\n\nFaza 1 (konsumpcja kontraktów `subactor/twin` i `twin-probes`) i Faza 2\n(wiązanie w profilu `wellmanifest/autonomy`) budują zaufanie do artefaktów\ntego projektu. Jeżeli allowlista komend przepuszcza `make test && curl ...`,\na trasa LLM otwiera się sama na podstawie klucza leżącego w powłoce operatora,\nto wszystko powyżej jest zbudowane na fałszywej gwarancji.\n\n## Wykonane\n\n| ID | Kwestia | Naprawa |\n|---|---|---|\n| A-1 | allowlista jako prefiks stringa | `src/util/command.ts` — dopasowanie na wektorze tokenów, odrzucenie każdej składni powłoki; 24 wektory w `tests/command.test.ts` |\n| A-2 | routing fail-open | `flag_enabled` z domyślną wartością `False`, `scripts/check-flag-parity.py`, ładowanie `.env` w `Makefile` |\n| A-3 | REST bez uwierzytelnienia | `X-Twin-Token` na endpointach LLM, `_guard_bind` odmawia bindu spoza loopbacku t` ustawionymi na\n`new-project.intent/v3` — identyfikator należący do `wellmanifest/new-project`.\nPlik trafił do `make validate`, który zaczął drukować\n`SCHEMA-PASS project/ticket-002/intent.json`.\n\nZwalidowane wobec prawdziwego `governance/intent.schema.json` standardu, oba\nintenty odpadają identycznie, po 10 błędów każdy: brakuje `ticket`, `summary`,\n`forbiddenPaths`, `stacks`, `dependsOn`, `conflictsWith`, `integrationTicket`\ni `classification`; nadmiarowe są `purpose`, `status`, `forbiddenEffects`,\n`dependencies`, `evidencePolicy`.\n\n`ticket-001` deklarował ten identyfikator od początku istnienia repozytorium,\nnigdy go nie spełniając. `ticket-002` powielił kształt, a nowa bramka nadała\nniezgodności pozór dowodu.\n\nProjekt, którego teza brzmi „claim agenta nie jest dowodem\", postawił zieloną\nbramkę zamiast dowodu. To jest ta sama klasa defektu co B-1 (fixture\nnieodróżnialny od modelu), tylko wymierzona w zgodność ze standardem.\n\n## Naprawa\n\n| Element | Zmiana |\n|---|---|\n| `schemas/ticket-intent.schema.json` | usunięty |\n| `schemas/local-ticket-intent.schema.json` | ten sam kształt pod własną nazwą `subactor.twin-developer.ticket-intent/v1`, z opisem wprost mówiącym, czym **nie** jest |\n| `project/ticket-00{1,2,3}/intent.json` | deklarują wyłącznie lokalną przestrzeń nazw |\n| `scripts/check-schema-identity.py` | odrzuca każdy `$id` i `const` należący do obcego właściciela; w `make validate` |\n| `docs/AUDIT_AND_AUTONOMY_PLAN.md` | ustalenie zapisane jako E-0 wraz z wynikiem ankiety wellmanifest |\n\nBramka zweryfikowana negatywnie: po ponownym wstawieniu podrobionego `$id`\nzwraca `SCHEMA-IDENTITY-FAIL` i kod wyjścia 1.\n\n## Czego ten ticket **nie** robi\n\nNie doprowadza repozytorium do zgodności z `new-project.intent/v3`. Zgodność\nwymaga adopcji standardu, a ta jest zablokowana: `goal governance adopt`\npotrzebuje Goal ≥ 2.1.295, zainstalowany jest 2.1.284 i nie ma podkomendy\n`governance`. Migracja intentów należy do Fazy 1 planu.\n\         let currentFile = null;

        function renderFileList(filter = '') {
            const list = document.getElementById('fileList');
            const filtered = files.filter(f =>
                f.name.toLowerCase().includes(filter.toLowerCase()) ||
                f.path.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">No files found</div>';
                return;
            }

            // Group by type
            const groups = {};
            for (const file of filtered) {
                const type = file.type_name;
                if (!groups[type]) groups[type] = [];
                groups[type].push(file);
            }

            let html = '';
            for (const [typeName, groupFiles] of Object.entries(groups)) {
                html += `
                    <div class="file-group">
                        <div class="file-group-title">${typeName} Files (${groupFiles.length})</div>
                        ${groupFiles.map(f => `
                            <div class="file-item ${currentFile?.name === f.name ? 'active' : ''}"
                                 onclick="selectFile('${f.name}')">
                                <span class="file-icon">${f.icon}</span>
                                <div class="file-info">
                                    <div class="file-name">${f.name}</div>
                                    <div class="file-meta">${f.path}</div>
                                </div>
                                <span class="file-size">${f.size}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            list.innerHTML = html;
        }

        function selectFile(name) {
            const file = files.find(f => f.name === name);
            if (!file) return;

            currentFile = file;

            document.getElementById('contentIcon').textContent = file.icon;
            document.getElementById('contentTitle').textContent = file.name;

            // Actions
            const actions = document.getElementById('contentActions');
            actions.innerHTML = `
                <a href="${file.rel_path}" download class="btn">⬇ Download</a>
                <a href="${file.rel_path}" target="_blank" class="btn btn-primary">↗ Open Raw</a>
            `;

            // Content
            const body = document.getElementById('contentBody');
            if (file.type === 'markdown') {
                // Render markdown as HTML using marked.js
                body.innerHTML = `<div class="markdown-content">${marked.parse(file.content)}</div>`;
            } else if (file.type === 'html') {
                // For HTML files, show in iframe for safety
                body.innerHTML = `<iframe src="${file.rel_path}" style="width:100%;height:100%;border:none;border-radius:0.5rem;"></iframe>`;  # noqa: E501
            } else if (file.type === 'image') {
                // For images, display the actual image
                body.innerHTML = `<div class="image-preview"><img src="${file.rel_path}" alt="${file.name}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:0.5rem;"></div>`;  # noqa: E501
            } else if (file.type === 'mermaid') {
                // Render mermaid diagram
                const diagramId = 'mermaid-diagram-' + Date.now();
                body.innerHTML = `<div class="mermaid-content"><pre class="mermaid" id="${diagramId}">${file.content}</pre></div>`;  # noqa: E501
                // Initialize mermaid on the new element
                setTimeout(() => {
                    mermaid.init(undefined, document.getElementById(diagramId));
                }, 0);
            } else if (file.type === 'json') {
                try {
                    const json = JSON.parse(file.content.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'));  # noqa: E501
                    const formatted = JSON.stringify(json, null, 2);
                    body.innerHTML = `<pre><code class="language-json">${formatted.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;  # noqa: E501
                    hljs.highlightElement(body.querySelector('code'));
                } catch {
                    body.innerHTML = `<pre>${file.content}</pre>`;
                }
            } else if (file.type === 'yaml') {
                // YAML with syntax highlighting
                body.innerHTML = `<pre><code class="language-yaml">${file.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;  # noqa: E501
                hljs.highlightElement(body.querySelector('code'));
            } else if (file.type === 'toon') {
                // TOON with simple highlighting (use ini as closest match for key: value format)
                body.innerHTML = `<pre><code class="language-ini">${file.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;  # noqa: E501
                hljs.highlightElement(body.querySelector('code'));
            } else if (file.type === 'code') {
                // Code files with auto-highlighting
                body.innerHTML = `<pre><code>${file.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;  # noqa: E501
                hljs.highlightElement(body.querySelector('code'));
            } else {
                body.innerHTML = `<pre>${file.content}</pre>`;
            }

            renderFileList(document.getElementById('search').value);
        }

        function renderStats() {
