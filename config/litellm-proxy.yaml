model_list:
  - model_name: twin-intent
    litellm_params:
      model: openrouter/openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0
  - model_name: twin-guidelines
    litellm_params:
      model: openrouter/openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0
  - model_name: twin-code
    litellm_params:
      model: openrouter/openrouter/auto
